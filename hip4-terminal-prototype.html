<!-- Three structural takes on the HIP-4 terminal. Option 1, Terminal Grid, is the chosen default. Switch with ?variant=grid|trade|studio. Every market, price, balance, and order in this file is fictional. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIP-4 Terminal · Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #bfc5cd;
      --surface: #f5f6f7;
      --surface-2: #e5e8ec;
      --surface-3: #d4d9df;
      --line: #89929d;
      --line-soft: #c2c8cf;
      --text: #18202a;
      --muted: #586270;
      --muted-2: #35404c;
      --blue: #174f9d;
      --blue-soft: #d8e5f5;
      --green: #168c35;
      --green-soft: #d4eed9;
      --red: #b52a35;
      --red-soft: #f3d7dc;
      --amber: #8a6422;
      --shadow: 0 8px 24px #0005;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 360px; background: var(--bg); color: var(--text); font-size: 12px; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .mono, .num, td.num, .price { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .blue { color: var(--blue); }
    .caps { text-transform: uppercase; letter-spacing: .08em; }
    .small { font-size: 10px; }
    .micro { font-size: 9px; }

    #app { min-height: 100vh; padding-bottom: 55px; }
    .topbar { height: 48px; display:flex; align-items:center; gap: 14px; padding: 0 14px; background:#14181d; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:8px; min-width: 144px; font-weight:700; letter-spacing:.04em; }
    .brand-mark { width:19px; height:19px; display:grid; place-items:center; color:#0f161b; background:var(--blue); font-size:10px; font-weight:900; border-radius:3px; }
    .top-divider { height:22px; border-left:1px solid var(--line); }
    .market-select { width:min(370px, 34vw); height:30px; padding:0 9px; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:3px; }
    .top-actions { display:flex; align-items:center; gap:7px; margin-left:auto; }
    .top-chip, .net-chip { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 8px; color:var(--muted-2); background:var(--surface-2); border:1px solid var(--line); border-radius:3px; white-space:nowrap; }
    .dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px #40c89766; }
    .account-chip { color:var(--text); }
    .icon-button { width:28px; height:28px; display:grid; place-items:center; border:1px solid transparent; background:transparent; color:var(--muted-2); cursor:pointer; border-radius:3px; }
    .icon-button:hover { background:var(--surface-3); color:var(--text); }
    .btn { min-height:29px; padding:0 10px; border:1px solid var(--line); border-radius:3px; background:var(--surface-3); cursor:pointer; font-weight:600; }
    .btn:hover { filter:brightness(1.12); }
    .btn-primary { background:#2c5f9f; border-color:#3b75bb; color:white; }
    .btn-buy { background:#174e3c; border-color:#24785d; color:#9ae2c9; }
    .btn-sell { background:#532b30; border-color:#874249; color:#ffc1c1; }
    .btn-quiet { background:transparent; }
    .select-small { height:27px; padding:0 7px; color:var(--muted-2); border:1px solid var(--line); border-radius:3px; background:var(--surface-2); }

    .panel { min-width:0; min-height:0; background:var(--surface); border:1px solid var(--line); }
    .panel-head { min-height:31px; display:flex; align-items:center; gap:8px; padding:0 9px; border-bottom:1px solid var(--line); background:#191e24; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .panel-head .head-tail { margin-left:auto; color:var(--muted); font-weight:500; letter-spacing:0; text-transform:none; }
    .panel-body { min-width:0; min-height:0; }
    .market-context { display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; padding:9px 11px; background:#151a20; border-bottom:1px solid var(--line-soft); }
    .context-question { min-width:240px; flex:1; font-weight:650; font-size:13px; }
    .context-rule { flex-basis:100%; color:var(--muted); font-size:10px; margin-top:-2px; }
    .badge { display:inline-flex; align-items:center; min-height:18px; padding:0 6px; border-radius:2px; font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
    .badge-blue { background:var(--blue-soft); color:#a9cbff; }
    .badge-green { background:var(--green-soft); color:#80dfbd; }
    .badge-red { background:var(--red-soft); color:#f4a8a8; }
    .badge-amber { background:#3b3327; color:#ecc98e; }

    /* Variant 1: compact three-pane workstation. */
    .grid-layout { display:grid; grid-template-columns:218px minmax(380px,1fr) 300px; grid-template-rows:minmax(540px,calc(100vh - 242px)) 176px 25px; gap:5px; padding:5px; }
    .grid-layout .watch-panel { grid-column:1; grid-row:1; }
    .grid-layout .charts-column { grid-column:2; grid-row:1; display:grid; grid-template-rows:1fr 1fr; gap:5px; min-height:0; }
    .grid-layout .right-column { grid-column:3; grid-row:1; display:grid; grid-template-rows:minmax(270px, 1.05fr) minmax(260px, .95fr); gap:5px; min-height:0; }
    .grid-layout .terminal { grid-column:1 / 4; grid-row:2; }
    .grid-layout .statusline { grid-column:1 / 4; grid-row:3; }
    .watch-row { width:100%; display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:center; padding:8px 8px; text-align:left; border:0; border-bottom:1px solid var(--line-soft); background:transparent; cursor:pointer; }
    .watch-row:hover { background:#202833; }
    .watch-row.active { background:#1d2b3e; box-shadow:inset 2px 0 var(--blue); }
    .watch-symbol { font-weight:700; }
    .watch-question { min-width:0; grid-column:1/-1; overflow:hidden; color:var(--muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .watch-price { text-align:right; }
    .watch-change { text-align:right; font-size:10px; }
    .watch-search { display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--line-soft); }
    .watch-search input { width:100%; min-width:0; height:26px; padding:0 7px; border:1px solid var(--line); border-radius:3px; color:var(--text); background:var(--bg); outline:none; }
    .watch-foot { padding:9px; color:var(--muted); border-top:1px solid var(--line-soft); font-size:9px; }
    .watch-list { overflow:auto; }
    .chart-panel { display:flex; flex-direction:column; }
    .chart-titlebar { min-height:35px; display:flex; align-items:center; gap:8px; padding:4px 9px; border-bottom:1px solid var(--line-soft); }
    .chart-name { font-weight:700; }
    .chart-current { margin-left:auto; text-align:right; font-size:14px; font-weight:700; }
    .chart-current small { display:block; font-size:9px; font-weight:500; }
    .chart-tools { display:flex; align-items:center; gap:2px; }
    .time-btn { padding:4px 5px; color:var(--muted); background:none; border:0; border-radius:2px; font-size:9px; cursor:pointer; }
    .time-btn:hover, .time-btn.selected { color:var(--text); background:#2a313a; }
    .chart-wrap { flex:1; min-height:120px; padding:6px 8px 2px; }
    .chart-svg { width:100%; height:100%; display:block; overflow:visible; }
    .chart-svg .gridline { stroke:#353c46; stroke-width:1; }
    .chart-svg .axis-label { fill:#78838f; font:9px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .chart-svg .candle-up { fill:#40c897; stroke:#40c897; }
    .chart-svg .candle-down { fill:#e87579; stroke:#e87579; }
    .chart-svg .volume { fill:#40c897; opacity:.20; }
    .chart-footer { min-height:23px; display:flex; align-items:center; justify-content:space-between; padding:0 9px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:9px; }
    .stats-strip { display:flex; gap:16px; align-items:center; padding:5px 9px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:9px; }
    .stats-strip b { margin-left:4px; color:var(--text); font-weight:600; }

    /* Shared book and order controls. */
    .book-metrics { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:7px 8px; border-bottom:1px solid var(--line-soft); }
    .book-metric { color:var(--muted); font-size:9px; }
    .book-metric strong { display:block; margin-top:2px; color:var(--text); font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .book-head, .book-row { display:grid; grid-template-columns:1fr 1fr 1fr; align-items:center; gap:5px; padding:3px 8px; font:10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .book-head { padding-top:5px; padding-bottom:5px; color:var(--muted); border-bottom:1px solid var(--line-soft); font:9px Inter, sans-serif; text-transform:uppercase; letter-spacing:.05em; }
    .book-row { position:relative; min-height:19px; border:0; width:100%; background:transparent; cursor:pointer; text-align:left; }
    .book-row:hover { background:#ffffff0b; }
    .book-row .depth { position:absolute; top:2px; bottom:2px; z-index:0; opacity:.12; pointer-events:none; }
    .book-row > span { position:relative; z-index:1; }
    .book-row.ask .depth { right:0; background:var(--red); }
    .book-row.bid .depth { right:0; background:var(--green); }
    .book-spread { padding:4px 8px; color:var(--muted-2); border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); font:9px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .book-side-label { padding:4px 8px 1px; color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.05em; }
    .book-note { padding:5px 8px; color:var(--muted); font-size:9px; }
    .ticket { display:flex; flex-direction:column; }
    .side-toggle { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:8px 8px 5px; }
    .side-toggle .btn { min-height:28px; }
    .ticket-fields { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:6px 8px; }
    .field { min-width:0; display:flex; flex-direction:column; gap:4px; }
    .field label { color:var(--muted); font-size:9px; }
    .input-wrap { display:flex; align-items:center; min-width:0; border:1px solid var(--line); border-radius:3px; background:#111519; }
    .input-wrap input { width:100%; min-width:0; height:29px; padding:0 7px; color:var(--text); background:transparent; border:0; outline:0; text-align:right; }
    .input-wrap span { padding-right:7px; color:var(--muted); font-size:9px; }
    .ticket-select { width:100%; height:29px; padding:0 6px; color:var(--text); border:1px solid var(--line); border-radius:3px; background:#111519; }
    .estimate { display:grid; grid-template-columns:1fr auto; gap:5px; padding:7px 8px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:9px; }
    .estimate strong { color:var(--text); font:10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .review-wrap { padding:5px 8px 8px; }
    .review-wrap .btn { width:100%; min-height:32px; }
    .position-summary { display:flex; justify-content:space-between; gap:8px; padding:6px 8px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:9px; }
    .position-summary strong { color:var(--text); }

    /* Shared bottom terminal. */
    .terminal { display:flex; flex-direction:column; }
    .terminal-tabs { height:32px; display:flex; align-items:stretch; gap:2px; padding:0 7px; border-bottom:1px solid var(--line); background:#191e24; }
    .terminal-tab { padding:0 9px; color:var(--muted); background:transparent; border:0; border-bottom:2px solid transparent; font-size:10px; cursor:pointer; }
    .terminal-tab:hover { color:var(--text); }
    .terminal-tab.active { color:var(--text); border-bottom-color:var(--blue); }
    .terminal-content { flex:1; min-height:0; overflow:auto; }
    .data-table { width:100%; border-collapse:collapse; font-size:10px; }
    .data-table th { height:24px; padding:0 9px; color:var(--muted); border-bottom:1px solid var(--line-soft); font-weight:500; text-align:left; white-space:nowrap; }
    .data-table td { height:25px; padding:0 9px; border-bottom:1px solid #262c33; white-space:nowrap; }
    .data-table td.num, .data-table th.num { text-align:right; }
    .table-action { border:0; background:none; color:var(--blue); font-size:9px; cursor:pointer; }
    .empty-state { padding:15px; color:var(--muted); text-align:center; }
    .statusline { display:flex; align-items:center; gap:16px; padding:0 7px; color:var(--muted); background:#14181d; border:1px solid var(--line); font-size:9px; white-space:nowrap; overflow:hidden; }
    .statusline .mock-state { overflow:hidden; text-overflow:ellipsis; }
    .statusline .spacer { margin-left:auto; }
    .mock-disclaimer { color:var(--amber); font-weight:700; letter-spacing:.06em; }

    /* Variant 2: market on top, one large contract chart, ticket is the primary column. */
    .trade-page { padding:6px; }
    .trade-top { display:flex; gap:6px; align-items:stretch; margin-bottom:6px; }
    .trade-market-head { flex:1; min-width:0; display:flex; align-items:center; gap:14px; padding:10px 13px; background:#18212c; border:1px solid #304054; }
    .trade-market-title { min-width:0; flex:1; }
    .trade-question { margin:5px 0 0; font-size:15px; font-weight:650; }
    .trade-head-stat { min-width:90px; padding-left:14px; border-left:1px solid #394a5e; }
    .trade-head-stat span { color:var(--muted); display:block; font-size:9px; }
    .trade-head-stat strong { display:block; margin-top:4px; font:14px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .market-rail { display:flex; gap:5px; overflow:auto; padding:5px; background:#151a20; border:1px solid var(--line); }
    .market-rail .watch-row { min-width:160px; width:auto; border:1px solid var(--line-soft); border-radius:3px; }
    .trade-main { display:grid; grid-template-columns:minmax(420px,1.7fr) minmax(290px,.78fr); gap:6px; min-height:0; }
    .trade-left { display:grid; grid-template-rows:minmax(330px,1fr) 166px; gap:6px; min-height:0; }
    .contract-focus { display:flex; flex-direction:column; min-height:0; background:#161c23; border:1px solid #324150; }
    .contract-focus .chart-wrap { min-height:230px; padding:10px 12px 2px; }
    .contract-focus .chart-titlebar { min-height:45px; padding:7px 12px; }
    .contract-focus .chart-name { font-size:12px; }
    .contract-focus .chart-current { font-size:21px; }
    .underlying-strip { display:grid; grid-template-columns:190px 1fr 120px; gap:8px; align-items:center; padding:8px 10px; background:#1c222a; border:1px solid var(--line); }
    .underlying-strip .mini-chart { height:47px; }
    .mini-chart .chart-svg .axis-label { display:none; }
    .trade-right { display:grid; grid-template-rows:auto minmax(230px,1fr) 202px; gap:6px; min-height:0; }
    .ticket-focus { min-height:325px; background:#19212b; border:1px solid #34465c; }
    .ticket-focus .panel-head { min-height:37px; background:#1e2935; }
    .ticket-focus .side-toggle { padding-top:11px; }
    .ticket-focus .side-toggle .btn { min-height:34px; font-size:12px; }
    .ticket-focus .ticket-fields { gap:10px; padding:10px; }
    .ticket-focus .input-wrap input, .ticket-focus .ticket-select { height:35px; }
    .ticket-focus .estimate { padding:9px 10px; font-size:10px; }
    .ticket-focus .estimate strong { font-size:11px; }
    .ticket-focus .review-wrap { padding:8px 10px 10px; }
    .ticket-focus .review-wrap .btn { min-height:37px; font-size:12px; }
    .trade-bottom { margin-top:6px; height:164px; }
    .trade-status { margin-top:5px; min-height:25px; }

    /* Variant 3: side-by-side chart studio with market ribbon and a wide bottom ticket. */
    .studio-page { padding:6px; }
    .studio-header { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#171e25; border:1px solid var(--line); }
    .studio-symbol { font-size:14px; font-weight:750; }
    .studio-title { min-width:0; flex:1; }
    .studio-question { margin-top:4px; color:var(--muted-2); font-size:11px; }
    .studio-meta { display:flex; gap:20px; }
    .studio-meta div { color:var(--muted); font-size:9px; }
    .studio-meta strong { display:block; margin-top:3px; color:var(--text); font:11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .studio-rail { display:flex; gap:5px; overflow:auto; margin:5px 0; }
    .studio-rail .watch-row { width:auto; min-width:174px; padding:6px 8px; border:1px solid var(--line); background:#161b21; }
    .studio-grid { display:grid; grid-template-columns:minmax(240px,1fr) minmax(240px,1fr) 280px; grid-template-rows:minmax(315px,1fr) 216px 152px 23px; gap:5px; }
    .studio-underlying { grid-column:1; grid-row:1; }
    .studio-contract { grid-column:2; grid-row:1; }
    .studio-book { grid-column:3; grid-row:1 / 3; }
    .studio-indicators { grid-column:1 / 3; grid-row:2; }
    .studio-ticket { grid-column:1 / 4; grid-row:3; display:grid; grid-template-columns:175px 1fr 1fr 1fr 1.5fr 200px; align-items:center; gap:10px; padding:8px 12px; }
    .studio-ticket .ticket-head { grid-column:1; }
    .studio-ticket .side-toggle { grid-column:2; padding:0; }
    .studio-ticket .ticket-fields { grid-column:3 / 5; padding:0; }
    .studio-ticket .estimate { grid-column:5; border:0; grid-template-columns:1fr 1fr; padding:0; }
    .studio-ticket .review-wrap { grid-column:6; padding:0; }
    .studio-ticket .position-summary { grid-column:1 / -1; padding:4px 0 0; }
    .studio-terminal { grid-column:1 / 4; grid-row:4; }
    .studio-status { grid-column:1 / 4; grid-row:5; }
    .studio-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0; padding:12px 14px; }
    .studio-stat { padding:3px 12px; border-left:1px solid var(--line); }
    .studio-stat:first-child { border:0; padding-left:2px; }
    .studio-stat span { display:block; color:var(--muted); font-size:9px; }
    .studio-stat strong { display:block; margin-top:5px; font:14px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .studio-stats-note { padding:0 14px 10px; color:var(--muted); font-size:9px; }

    /* Compact MT5-inspired skin: flat gray chrome, narrow panes, and a black chart canvas. */
    .window-titlebar { height:21px; display:flex; align-items:center; gap:6px; padding:0 6px; color:#253140; background:linear-gradient(#f1f6fc,#d8e3f1); border:1px solid #8592a1; border-bottom:0; font-size:10px; }
    .window-titlebar .brand-mark { width:14px; height:14px; border-radius:0; font-size:8px; }
    .window-titlebar .window-controls { margin-left:auto; display:flex; gap:13px; padding-right:4px; color:#253140; font-size:11px; }
    .menubar { height:21px; display:flex; align-items:center; gap:18px; padding:0 8px; color:#18202a; background:linear-gradient(#f7f8fa,#e2e5e9); border:1px solid #89929d; border-bottom-color:#b5bbc3; font-size:10px; }
    .topbar { height:34px; gap:7px; padding:0 6px; background:linear-gradient(#eef0f3,#dce0e5); border:1px solid #89929d; border-top:0; }
    .brand { min-width:103px; gap:5px; color:#24303d; font-size:10px; }
    .brand-mark { width:17px; height:17px; border-radius:1px; color:#fff; background:#315f97; }
    .top-divider { height:20px; border-color:#aeb5bd; }
    .market-select { width:min(330px,31vw); height:25px; padding:0 5px; color:#18202a; background:#fff; border:1px solid #929ba6; border-radius:0; font-size:10px; }
    .top-actions { gap:4px; }
    .top-chip, .net-chip { height:23px; padding:0 5px; color:#26313d; background:#f8f9fa; border:1px solid #a3abb4; border-radius:0; font-size:9px; }
    .net-chip { background:#eef5ee; }
    .account-chip { color:#18202a; }
    .top-actions .btn { min-height:23px; padding:0 7px; border-radius:0; font-size:10px; }
    .top-intervals { display:flex; align-items:center; gap:0; padding-left:4px; border-left:1px solid #abb2ba; }
    .top-intervals .time-btn { min-width:23px; padding:3px; color:#374250; border:1px solid transparent; border-radius:0; font-size:9px; }
    .top-intervals .time-btn.selected { color:#17212c; background:#f9fafb; border-color:#929ba6; }
    .icon-button { border-radius:0; color:#384451; }
    .btn, .select-small { border-radius:0; }
    .btn { min-height:24px; padding:0 7px; background:linear-gradient(#fff,#dfe3e8); border-color:#929ba6; color:#18202a; font-size:10px; }
    .btn:hover { filter:brightness(.97); }
    .btn-primary { color:white; background:linear-gradient(#477bb4,#2b5e98); border-color:#315b8b; }
    .btn-buy { color:#075b22; background:linear-gradient(#e7f5e9,#cce9d1); border-color:#82b88d; }
    .btn-sell { color:#8e1825; background:linear-gradient(#fae8eb,#efd0d5); border-color:#c68a92; }
    .select-small { height:23px; color:#18202a; background:#fff; }
    .panel { background:#f8f9fa; border:1px solid #828c98; }
    .panel-head { min-height:23px; gap:5px; padding:0 5px; background:linear-gradient(#f7f8fa,#e2e6eb); border-bottom-color:#aab1b9; color:#27313c; font-size:9px; letter-spacing:.02em; }
    .panel-head .head-tail { color:#586270; }
    .market-context { gap:5px 8px; padding:5px 6px; background:#e8ebef; border-bottom-color:#c0c6cd; }
    .context-question { font-size:11px; }
    .context-rule { font-size:9px; }

    function chartSvg(kind, price, interval=state.interval) {
      const n = 32, width = 820, height = 210, left = 54, right = 66, top = 14, bottom = 29;
      const plotW = width - left - right, plotH = height - top - bottom;
      let base = kind === 'probability' ? price * 100 : price;
      let spread = kind === 'probability' ? 11 : base * .018;
      let value = base * (kind === 'probability' ? .94 : .996);
      const rows = [];
      for (let i=0;i<n;i++) {
        const wave = Math.sin(i * .71 + (kind === 'probability' ? 1.7 : .4)) * .31 + Math.sin(i * .21) * .24;
        const trend = (i / n - .45) * (kind === 'probability' ? 4.8 : base * .005);
        const open = value;
        const close = base + (wave + trend) * spread;
        const high = Math.max(open, close) + (Math.abs(Math.sin(i * 1.3)) * .22 + .09) * spread;
        const low = Math.min(open, close) - (Math.abs(Math.cos(i * 1.13)) * .20 + .08) * spread;
        rows.push({ open, close, high, low }); value = close;
      }
      const min = Math.min(...rows.map(r=>r.low)), max = Math.max(...rows.map(r=>r.high)), pad = (max-min)*.12;
      const lo = min-pad, hi = max+pad;
      const y = v => top + (hi-v)/(hi-lo)*plotH;
      const step = plotW/n, candleW = Math.max(4, step*.48);
      const grid = [0,1,2,3].map(i => {
        const gy = top + plotH * i/3, v = hi-(hi-lo)*i/3;
        const label = kind === 'probability' ? `${fmt(v,0)}¢` : money(v);
        return `<line class="gridline" x1="${left}" x2="${width-right}" y1="${gy}" y2="${gy}"/><text class="axis-label" x="${width-right+4}" y="${gy+3}">${label}</text>`;
      }).join('');
      const candles = rows.map((r,i) => {
        const x = left + i*step + step/2, up = r.close >= r.open;
        const yo=y(r.open), yc=y(r.close), bodyY=Math.min(yo,yc), bodyH=Math.max(1.5,Math.abs(yc-yo));
        const volH=4+(Math.abs(Math.sin(i*1.8))*.20+.1)*13;
        return `<g class="${up?'candle-up':'candle-down'}"><line x1="${x}" x2="${x}" y1="${y(r.high)}" y2="${y(r.low)}" stroke-width="1"/><rect x="${x-candleW/2}" y="${bodyY}" width="${candleW}" height="${bodyH}" rx=".5"/><rect class="volume" x="${x-candleW/2}" y="${height-bottom+2}" width="${candleW}" height="${volH}"/></g>`;
      }).join('');
      const vertical = Array.from({length:9},(_,i)=>{const x=left+i*plotW/8;return `<line class="gridline" x1="${x}" x2="${x}" y1="${top}" y2="${height-bottom}"/>`;}).join('');
      const averageLine = period => rows.map((r,i)=>{const start=Math.max(0,i-period+1), sample=rows.slice(start,i+1), average=sample.reduce((sum,item)=>sum+item.close,0)/sample.length;return `${left+i*step+step/2},${y(average)}`;}).join(' ');
      const averages = `<polyline class="ma-fast" points="${averageLine(4)}"/><polyline class="ma-medium" points="${averageLine(9)}"/><polyline class="ma-slow" points="${averageLine(17)}"/>`;
      const ticks = interval === '15m' ? ['14:00','16:00','18:00','20:00'] : interval === '4H' ? ['Mon 00','Mon 12','Tue 00','Tue 12'] : interval === '1D' ? ['Oct 22','Oct 24','Oct 26','Oct 28'] : ['09:00','12:00','15:00','18:00'];
      const xlabels = ticks.map((t,i) => `<text class="axis-label" x="${left+i*plotW/3}" y="${height-4}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${t}</text>`).join('');
      const valueY=y(base), label=kind === 'probability' ? `${Math.round(base)}¢` : money(base);
      return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Fictional ${kind === 'probability' ? 'YES contract probability' : 'underlying asset'} candlestick chart, ${interval} candles"><title>${kind === 'probability' ? 'YES contract' : 'Underlying'} chart · fictional sample data</title>${grid}${vertical}<line x1="${left}" x2="${width-right}" y1="${valueY}" y2="${valueY}" stroke="#bcc3ca" stroke-dasharray="3 3" stroke-width="1"/><rect x="${width-right+3}" y="${valueY-8}" width="${right-5}" height="16" rx="0" fill="#68798a"/><text x="${width-right+7}" y="${valueY+3}" fill="#fff" font="9px ui-monospace, monospace">${label}</text>${candles}${averages}${xlabels}</svg>`;
    }
    function timeTools() {
      return `<div class="chart-tools" aria-label="Chart timeframe">${['15m','1H','4H','1D'].map(i=>`<button class="time-btn ${state.interval===i?'selected':''}" data-action="interval" data-value="${i}">${i}</button>`).join('')}</div>`;

    function chartPanel(kind, compact=false) {
      const m = currentMarket(), probability = kind === 'probability';
      const title = probability ? `${m.symbol} · YES contract` : `${m.underlying} · index price`;
      const quote = probability ? fmtPrice(m.yes) : money(m.price);

able <strong class="num">$24,580.00</strong></span></div></section>`;

      const m=currentMarket();
      return `${appChrome()}${topbar()}<main class="studio-page"><header class="studio-header"><div class="studio-symbol">${m.symbol}</div><div class="studio-title"><div class="badge badge-blue">YES / BINARY</div><div class="studio-question">${m.question}</div></div><div class="studio-meta"><div>Underlying<strong>${m.underlying} · ${money(m.price)}</strong></div><div>YES price<strong>${fmtPrice(m.yes)} USDC</strong></div><div>Resolution<strong>${m.expiry.split('·')[0]}</strong></div></div></header>${marketRibbon('studio-rail')}<div class="studio-grid"><div class="studio-underlying">${chartPanel('underlying')}</div><div class="studio-contract">${chartPanel('probability')}</div><div class="studio-book">${bookPanel()}</div><section class="panel studio-indicators"><div class="panel-head">Selected market stats <span class="head-tail">Configurable dock · sample metrics</span></div><div class="studio-stats"><div class="studio-stat"><span>Open interest</span><strong>${m.oi}</strong></div><div class="studio-stat"><span>24h volume</span><strong>${m.volume}</strong></div><div class="studio-stat"><span>YES / NO</span><strong>${fmtPrice(m.yes)} / ${fmtPrice(1-m.yes)}</strong></div><div class="studio-stat"><span>Settlement value</span><strong>1.000 USDC</strong></div></div><div class="studio-stats-note">Market metadata determines the underlying and outcome identifiers. Oracle and contract candles shown above are fictional for this visual prototype.</div></section><section class="panel studio-ticket"><div class="ticket-head"><div class="panel-head" style="padding:0;border:0;background:transparent">Order ticket <span class="badge badge-amber">limit</span></div><div class="small muted" style="margin-top:5px">${m.symbol} · YES</div></div><div class="side-toggle"><button class="btn ${state.side==='buy'?'btn-buy':''}" data-action="side" data-value="buy">Buy YES</button><button class="btn ${state.side==='sell'?'btn-sell':''}" data-action="side" data-value="sell">Sell YES</button></div><div class="ticket-fields"><div class="field"><label for="limit-price">Price</label><div class="input-wrap"><input id="limit-price" data-action="price-input" type="number" min="0.001" max="0.999" step="0.001" value="${fmtPrice(state.limit)}"><span>USDC</span></div></div><div class="field"><label for="quantity">Quantity</label><div class="input-wrap"><input id="quantity" data-action="qty-input" type="number" min="1" step="1" value="${state.quantity}"><span>YES</span></div></div></div><div class="estimate"><span>${state.side==='buy'?'Cost':'Proceeds'}</span><strong>${money(state.limit*state.quantity)}</strong><span>Max loss</span><strong>${money(maxLoss())}</strong><span>Settlement</span><strong>${money(state.quantity)}</strong><span>Fees</span><strong>${money(fee())}</strong></div><div class="review-wrap"><button class="btn btn-primary" data-action="review">Review order</button></div><div class="position-summary"><span>Position <strong>${m.position} YES</strong></span><span>Avg <strong>${fmtPrice(m.avg||0)}</strong></span><span>Balance <strong>$24,580</strong></span></div></section>${terminal('studio-terminal')}${statusline('studio-status')}</div></main>`;
    }
    function render() {
      const variant = activeVariant();
      const content = variant === 'trade' ? tradeView() : variant === 'studio' ? studioView() : gridView();
      app.innerHTML = content + `<div class="variant-tag">HIP-4 TERMINAL · PROTOTYPE</div><nav class="prototype-switcher" aria-label="Prototype layout variants"><button data-action="variant-prev" aria-label="Previous layout">‹</button><span class="switcher-label">${VARIANTS.find(v=>v.id===variant)?.name || VARIANTS[0].name} <span class="muted">· ${VARIANTS.findIndex(v=>v.id===variant)+1}/3</span></span><button data-action="variant-next" aria-label="Next layout">›</button></nav>`;
      updateEstimates();
    }
    function updateEstimates() {
      const set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};
      set('estimate-cost',money(state.limit*state.quantity));
      set('estimate-loss',money(maxLoss()));
      set('estimate-payout',money(state.quantity));
      set('estimate-fee',money(fee()));
    }
    function setVariant(id) {
      const url=new URL(location.href);
      url.searchParams.set('variant',id);
      history.replaceState(null,'',url);
      render();
    }
    function showToast(message) {
      let toast=document.querySelector('.toast');
      if(!toast){toast=document.createElement('div');toast.className='toast';document.body.appendChild(toast);}
      toast.textContent=message; toast.classList.add('show');
      clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800);
    }
    function openReview() {
      const m=currentMarket(), cost=state.limit*state.quantity, feeValue=fee();
      overlayRoot.innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="review-title"><div class="modal-head"><span id="review-title">Review simulated order</span><button class="icon-button" data-action="close-review" aria-label="Close review">×</button></div><div class="modal-body"><div class="small muted">${m.question}</div><div class="modal-summary" style="margin-top:10px"><div><span>Action</span><strong class="${state.side==='buy'?'positive':'negative'}">${state.side.toUpperCase()} YES</strong></div><div><span>Order type</span><strong>LIMIT</strong></div><div><span>Limit price</span><strong>${fmtPrice(state.limit)} USDC</strong></div><div><span>Quantity</span><strong>${state.quantity} contracts</strong></div><div><span>${state.side==='buy'?'Estimated cost':'Estimated proceeds'}</span><strong>${money(cost)}</strong></div><div><span>Fee estimate</span><strong>${money(feeValue)}</strong></div><div><span>Maximum loss</span><strong>${money(maxLoss())}</strong></div><div><span>Potential settlement</span><strong>${money(state.quantity)}</strong></div></div><p class="modal-warning">Prototype only: confirming adds an in-memory mock order to the Open orders tab. No wallet, API, or exchange request is used.</p><div class="modal-actions"><button class="btn btn-quiet" data-action="close-review">Back to ticket</button><button class="btn btn-primary" data-action="confirm-order">Submit simulated order</button></div></div></section></div>`;
    }
    function confirmOrder() {
      const id='MOCK-'+(1043+state.orders.length);
      const m=currentMarket();
      const order={id,market:m.symbol,side:(state.side==='buy'?'Buy':'Sell')+' YES',qty:state.quantity,price:state.limit,status:'Open'};
      state.orders.unshift(order);
      state.history.unshift({time:new Date().toLocaleTimeString('en-GB'),market:m.symbol,detail:`${order.side} · ${order.qty} @ ${fmtPrice(order.price)} · mock`,status:'Submitted'});
      state.lastAction=`${id} submitted · mock`;
      state.tab='orders'; overlayRoot.innerHTML=''; render(); showToast(`${id} added to mock open orders`);
    }

    document.addEventListener('click', event => {
      const el=event.target.closest('[data-action]');
      if(!el) return;
      const action=el.dataset.action;
      if(action==='variant-prev'||action==='variant-next'){
        const current=VARIANTS.findIndex(v=>v.id===activeVariant()), step=action==='variant-next'?1:-1;
        setVariant(VARIANTS[(current+step+VARIANTS.length)%VARIANTS.length].id);
      }
      if(action==='market') { state.marketId=el.dataset.id; state.limit=currentMarket().yes; state.lastAction='Market changed · mock'; render(); }
      if(action==='side') { state.side=el.dataset.value; render(); }
      if(action==='interval') { state.interval=el.dataset.value; render(); }
      if(action==='tab') { state.tab=el.dataset.value; render(); }
      if(action==='book-price') { state.limit=Number(el.dataset.price); render(); showToast(`Limit price set to ${fmtPrice(state.limit)} from order book`); }
      if(action==='review') openReview();
      if(action==='close-review') overlayRoot.innerHTML='';
      if(action==='confirm-order') confirmOrder();
      if(action==='cancel') {
        const order=state.orders.find(o=>o.id===el.dataset.id);
        if(order){order.status='Cancelled';state.lastAction=`${order.id} cancelled · mock`;state.history.unshift({time:new Date().toLocaleTimeString('en-GB'),market:order.market,detail:`Cancel request confirmed · ${order.id} · mock`,status:'Cancelled'});render();showToast(`${order.id} cancelled in simulation`);}
      }
      if(action==='backdrop' && event.target===el) overlayRoot.innerHTML='';
    });
    document.addEventListener('change', event => {
      if(event.target.matches('[data-action="market-select"]')) { state.marketId=event.target.value; state.limit=currentMarket().yes; state.lastAction='Market changed · mock'; render(); }
    });
    document.addEventListener('input', event => {
      if(event.target.matches('[data-action="search"]')) {
        const query=event.target.value.toLowerCase();
        document.querySelectorAll('.watch-row').forEach(row=>{row.hidden=!row.textContent.toLowerCase().includes(query);});
      }
      if(event.target.matches('[data-action="price-input"]')) { state.limit=Number(event.target.value)||0; updateEstimates(); updateStatusText(); }
      if(event.target.matches('[data-action="qty-input"]')) { state.quantity=Math.max(1,Number(event.target.value)||1); updateEstimates(); updateStatusText(); }
    });
    function updateStatusText() {
      document.querySelectorAll('.mock-state').forEach(el=>el.textContent=`${currentMarket().symbol} · ${state.side.toUpperCase()} YES · ${state.quantity} @ ${fmtPrice(state.limit)} · ${state.lastAction}`);
    }
    document.addEventListener('keydown', event => {
      if(event.key==='Escape' && overlayRoot.firstElementChild) overlayRoot.innerHTML='';
      if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight') return;
      if(event.target.matches('input, textarea, select, [contenteditable="true"]')) return;
      event.preventDefault();
      const current=VARIANTS.findIndex(v=>v.id===activeVariant()), step=event.key==='ArrowRight'?1:-1;
      setVariant(VARIANTS[(current+step+VARIANTS.length)%VARIANTS.length].id);
    });
    render();
  </script>
</body>
</html>
